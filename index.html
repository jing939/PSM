<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 AI - 개인화 문장 수정</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .options {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .option-group {
            flex: 1;
            min-width: 200px;
        }

        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-label {
            font-weight: 600;
            color: #333;
        }

        .btn-copy {
            padding: 8px 16px;
            background: #f5f5f5;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #e0e0e0;
        }

        .result-content {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            min-height: 100px;
            white-space: pre-wrap;
            line-height: 1.7;
            color: #333;
        }

        .result-content.placeholder {
            color: #999;
            font-style: italic;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .api-info {
            background: #e8f4fd;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #333;
        }

        .api-info input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #cce4f7;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 8px;
        }

        .api-info input:focus {
            outline: none;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✍️ 글쓰기 AI</h1>
        <p class="subtitle">Ollama API를 활용한 문장 수정 도우미</p>

        <div class="api-info">
            <strong>🔌 Ollama API 주소</strong>
            <input type="text" id="apiUrl" value="http://localhost:5000" placeholder="Ollama API 주소를 입력하세요">
        </div>

        <div class="input-section">
            <label for="inputText">수정할 문장을 입력하세요</label>
            <textarea id="inputText" placeholder="예: 오늘 날씨가 좋았다. 나들은갔다."></textarea>
        </div>

        <div class="options">
            <div class="option-group">
                <label for="modelSelect">AI 모델 선택</label>
                <select id="modelSelect">
                    <option value="llama3">Llama 3 (latest)</option>
                    <option value="llama3.2">Llama 3.2</option>
                    <option value="qwen2.5">Qwen 2.5</option>
                    <option value="phi4">Phi 4</option>
                    <option value="mistral">Mistral</option>
                </select>
            </div>
            <div class="option-group">
                <label for="styleSelect">수정 스타일</label>
                <select id="styleSelect">
                    <option value="natural">더 자연스럽게</option>
                    <option value="formal">더 격식 있게</option>
                    <option value="casual">더 친근하게</option>
                    <option value="polite">더 공손하게</option>
                    <option value="creative">더 창의적으로</option>
                </select>
            </div>
        </div>

        <button class="btn-submit" id="submitBtn">문장 수정하기</button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>AI가 문장을 수정하고 있습니다...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="result-section">
            <div class="result-header">
                <span class="result-label">📝 수정된 문장</span>
                <button class="btn-copy" id="copyBtn">복사</button>
            </div>
            <div class="result-content placeholder" id="resultContent">
                수정된 문장이 여기에 표시됩니다.
            </div>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const modelSelect = document.getElementById('modelSelect');
        const styleSelect = document.getElementById('styleSelect');
        const submitBtn = document.getElementById('submitBtn');
        const resultContent = document.getElementById('resultContent');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const copyBtn = document.getElementById('copyBtn');
        const apiUrlInput = document.getElementById('apiUrl');

        const stylePrompts = {
            natural: '더 자연스럽고 읽기 쉽게',
            formal: '더 격식 있고 공식적인',
            casual: '더 친근하고 가벼운',
            polite: '더 공손하고 예의바른',
            creative: '더 창의적이고 독특한'
        };

        async function improveText() {
            const text = inputText.value.trim();
            if (!text) {
                showError('문장을 입력해주세요.');
                return;
            }

            const apiUrl = apiUrlInput.value.trim() || 'http://localhost:11434';
            const model = modelSelect.value;
            const style = styleSelect.value;
            const styleText = stylePrompts[style];

            // UI 상태 업데이트
            submitBtn.disabled = true;
            loading.classList.add('active');
            errorDiv.classList.remove('active');
            resultContent.classList.add('placeholder');
            resultContent.textContent = '수정된 문장이 여기에 표시됩니다.';

            try {
                // CORS 우회: no-cors 모드로 요청 (응답은 opaque)
                const prompt = `다음 문장을 ${styleText} 표현으로 수정해주세요. 
변경 사항만 간단하게 출력하고, 추가 설명은 하지 마세요.

입력 문장: ${text}

수정된 문장:`;

                const response = await fetch(`${apiUrl}/api/generate`, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: model,
                        prompt: prompt,
                        stream: false,
                        options: {
                            temperature: 0.7,
                            top_p: 0.9
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 오류: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.response) {
                    resultContent.classList.remove('placeholder');
                    resultContent.textContent = data.response.trim();
                } else {
                    throw new Error('응답을 받지 못했습니다.');
                }

            } catch (error) {
                console.error('Error:', error);
                let errorMessage = error.message;
                
                // 더 구체적인 에러 메시지
                if (errorMessage.includes('Failed to fetch') || errorMessage.includes('NetworkError')) {
                    errorMessage = '❌ Ollama 서버에 연결할 수 없습니다.\n\n확인 사항:\n1. Ollama가 실행 중인지 확인: `ollama serve`\n2. 모델이 설치되어 있는지 확인: `ollama list`\n3. 포트가 11434인지 확인';
                } else if (errorMessage.includes('404')) {
                    errorMessage = '❌ 해당 모델을 찾을 수 없습니다.\n`ollama list`로 설치된 모델을 확인하고 선택해주세요.';
                } else if (errorMessage.includes('500')) {
                    errorMessage = '❌ Ollama 서버 오류입니다. 모델을 다운로드했는지 확인해주세요.';
                }
                
                showError(errorMessage);
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('active');
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
        }

        submitBtn.addEventListener('click', improveText);

        inputText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                improveText();
            }
        });

        copyBtn.addEventListener('click', () => {
            const text = resultContent.textContent;
            if (text && !resultContent.classList.contains('placeholder')) {
                navigator.clipboard.writeText(text).then(() => {
                    copyBtn.textContent = '복사됨!';
                    setTimeout(() => {
                        copyBtn.textContent = '복사';
                    }, 2000);
                });
            }
        });
    </script>
</body>
</html>
